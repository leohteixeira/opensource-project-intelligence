name: opensource-project-intelligence

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opensource_project_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-opensource}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opensource}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      # PostgreSQL 18 expects a single mount at /var/lib/postgresql and
      # places the cluster in a version-specific subdirectory; mounting
      # /var/lib/postgresql/data makes the image refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-opensource}']
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.14.3-alpine
    command: ['--jetstream', '--store_dir=/data', '--http_port=8222']
    expose:
      - '4222'
      - '8222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.0-alpine
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-opensource}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-opensource-development-only}
    expose:
      - '9000'
      - '9001'
    volumes:
      - object-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/ready']
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://object-storage:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      S3_BUCKET: ${S3_BUCKET:-opensource-project-intelligence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-opensource}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-opensource-development-only}
    depends_on:
      object-storage:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      HTTP_ADDRESS: 0.0.0.0:8100
      DATABASE_URL: postgres://${POSTGRES_USER:-opensource}:${POSTGRES_PASSWORD:-opensource}@postgres:5432/${POSTGRES_DB:-opensource_project_intelligence}
      JETSTREAM_ENABLED: 'true'
      NATS_URL: nats://nats:4222
      OBJECT_STORAGE_ENABLED: 'true'
      S3_ENDPOINT: http://object-storage:9000
      S3_BUCKET: ${S3_BUCKET:-opensource-project-intelligence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-opensource}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-opensource-development-only}
      VALKEY_ENABLED: 'true'
      VALKEY_URL: valkey://valkey:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - '${API_PORT:-8100}:8100'
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-opensource}:${POSTGRES_PASSWORD:-opensource}@postgres:5432/${POSTGRES_DB:-opensource_project_intelligence}
      JETSTREAM_ENABLED: 'true'
      NATS_URL: nats://nats:4222
      OBJECT_STORAGE_ENABLED: 'true'
      S3_ENDPOINT: http://object-storage:9000
      S3_BUCKET: ${S3_BUCKET:-opensource-project-intelligence}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-opensource}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-opensource-development-only}
      VALKEY_ENABLED: 'true'
      VALKEY_URL: valkey://valkey:6379
      WORKER_INTERVAL: ${WORKER_INTERVAL:-30s}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '${WEB_PORT:-3100}:3100'
    depends_on:
      - api

volumes:
  postgres-data:
  nats-data:
  object-data:
