components:
  schemas:
    ResourceID:
      type: string
      pattern: '^[0-9]+$'
      examples: ['732684512931872768']
    Document:
      type: object
      additionalProperties: true
    DependencyState:
      type: string
      enum: [available, unavailable, degraded, disabled]
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyState'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    Problem:
      description: A safe RFC 9457 problem response
